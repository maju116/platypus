# The look of both platypus sites. This file is meant to be byte-for-byte identical in the R
# package and in pyplatypus.
#
# This comment used to say "and a test in each repository says so". Nothing in either
# repository reads this file - grepped in both on 2026-10-14, after renaming the R package
# made the two copies diverge and not one test failed. So the identity is held by whoever
# edits it, which is the arrangement the sentence it replaced says does not work, and §3F's
# table of pairs does not list this file either. Named here rather than quietly fixed.
#
# THE PALETTE COMES FROM THE HEXSTICKER, which is the one thing the author asked to keep
# when both repositories were reset (CLAUDE.md §4c). Measured off
# assets/hexsticker_platypus.png rather than chosen: cream is 54.8% of its opaque pixels,
# the dark brown 12.1%, tan 9.1%, terracotta 4.1%. The 2022 mkdocs site set
# `palette: primary: brown`, so this is a return to the author's own choice rather than an
# invention - and it replaces the `#1c5d99` blue that was typed into _pkgdown.yml in
# September and matched nothing.
#
# CONTRAST IS A CONSTRAINT HERE, NOT A PREFERENCE. Measured against white, for the 4.5
# WCAG AA needs for body text:
#
#     brown      #53251d   11.8   links, text, anything small
#     terracotta #c5785c    3.7   large text only
#     tan        #de986d    2.6   decoration only
#     cream      #f4e0c0    1.3   background only
#
# Tan is the prettiest colour in the sticker and must not carry a link. That is why
# `primary` is the brown.

meta:
  name: platypus
  link:
    home: https://maju116.github.io/rplatypus/
    github: https://github.com/maju116/rplatypus

color:
  palette:
    brown: "#53251d"
    terracotta: "#c5785c"
    tan: "#de986d"
    cream: "#f4e0c0"
    ink: "#3d3636"
  foreground: ink
  background: white
  primary: brown
  secondary: terracotta
  # `light` is the tint behind a callout or a table head, where nothing is small enough for
  # contrast to matter.
  light: cream
  dark: ink

typography:
  fonts:
    - family: Source Sans 3
      source: google
    - family: JetBrains Mono
      source: google
  base:
    family: Source Sans 3
    line-height: 1.6
  headings:
    family: Source Sans 3
    weight: 600
  monospace:
    family: JetBrains Mono
    size: 0.9em
  link:
    color: brown
    decoration: underline
