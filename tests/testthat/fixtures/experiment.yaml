task: semantic_segmentation

data:
  train_path: PLACEHOLDER
  validation_path: PLACEHOLDER
  mode: nested_dirs
  colormap:
    - [0, 0, 0]
    - [255, 255, 255]
  subdirs: [images, masks]
  column_sep: ";"
  shuffle: true

output_dir: platypus_output

models:
  - name: unet
    architecture: u_net
    input_shape: [256, 256]
    channels: 3
    n_class: 2
    blocks: 4
    filters: 16
    loss:
      name: cce_dice
      cce_weight: 0.5
    metrics:
      - name: dice
        include_background: false
    optimizer:
      name: adam
      learning_rate: 0.001
    epochs: 20
    batch_size: 8
